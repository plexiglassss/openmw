name: Diagnostic timing build
on:
  workflow_dispatch:
  push:
    branches: [diagnostic-timing-2829ae6d]
permissions:
  contents: read
  actions: read
jobs:
  TimingTests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test timing recorder
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /I. custom/timing-tests/smoke.cpp /Fe:timing-smoke.exe
          if ($LASTEXITCODE) { throw "Compile failed" }
          $env:OPENMW_TIMING_FILE = "$PWD/timing-test.csv"
          ./timing-smoke.exe
          if ($LASTEXITCODE) { throw "Recorder test failed" }
          python custom/timing-tests/verify.py timing-test.csv
          if ($LASTEXITCODE) { throw "Timing verification failed" }
          cl /nologo /std:c++20 /EHsc /I. custom/timing-tests/actorfailure.cpp /Fe:actorfailure-smoke.exe
          if ($LASTEXITCODE) { throw "Actor diagnostic compile failed" }
          ./actorfailure-smoke.exe
          if ($LASTEXITCODE) { throw "CSV verification failed" }
  Engine:
    needs: TimingTests
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      msvc: "2022"
      build-type: Release
      package: false
      release: false
