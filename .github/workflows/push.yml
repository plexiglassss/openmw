name: OpenMW - cumulative Windows engine and preserved tools
on:
  pull_request:
    branches: [perf/gameplay-activation-20261106]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
env:
  CUMULATIVE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
  actions: read
concurrency:
  group: cumulative-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  Windows:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    env:
      # Keep tracked bytes identical to the verified source on Windows too.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: openmw-msvc-2022-Release-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
          fetch-depth: 100
      - name: Verify historical source gates and complete cumulative source
        shell: pwsh
        run: |
          $commits = @(
            'cbdf7a0adfac4c33f0d5f5bc62174f3bd3146fd0',
            'b34db5770f947b0f5b90dc699627c2ccdae12f16',
            '528bffb348872a964d25c092fa5dd574c1b7f673',
            '1b78b9c1a566b91bbe1576387842625f3ae509d1',
            '5b84be8c1b8fc283b58755127e1aa078d7f2b4a0',
            'caeede91ff424d63b398737eb0220dea29058981',
            '541a1e13cfcdac0c1101c08a465ea2c61ab951e4',
            '5a446619744f2b07eb5efecef75c048ad09d046b',
            'ba5c0bb03bb13604adf61781b8afb0d63ea231f0',
            '80ce5372258b3cffd972dbdd2565d80e940b9351'
          )
          foreach ($commit in $commits) {
            git fetch --no-tags --depth=100 origin $commit
            if ($LASTEXITCODE) { throw "Cannot recover preserved source $commit" }
          }
          $gates = @(
            @{ Path = 'preservation-dialogue'; Commit = '528bffb348872a964d25c092fa5dd574c1b7f673'; Script = 'custom/dialogue-colours/verify-source.py'; Manifest = 'dialogue-colours-source-manifest.json' },
            @{ Path = 'preservation-shrine'; Commit = '1b78b9c1a566b91bbe1576387842625f3ae509d1'; Script = 'custom/shrine-tooltips/verify-source.py'; Manifest = 'shrine-tooltips-source-manifest.json' },
            @{ Path = 'preservation-gameplay'; Commit = '5b84be8c1b8fc283b58755127e1aa078d7f2b4a0'; Script = 'custom/gameplay-responsiveness/verify-source.py'; Manifest = 'gameplay-responsiveness-source-manifest.json' },
            @{ Path = 'preservation-message'; Commit = 'caeede91ff424d63b398737eb0220dea29058981'; Script = 'custom/message-position/verify-source.py'; Manifest = 'message-position-source-manifest.json' }
          )
          foreach ($gate in $gates) {
            git worktree add --detach $gate.Path $gate.Commit
            if ($LASTEXITCODE) { throw "Cannot prepare $($gate.Path)" }
            try {
              python "$($gate.Path)/$($gate.Script)"
              if ($LASTEXITCODE) { throw "Preserved source gate failed: $($gate.Path)" }
              Copy-Item "$($gate.Path)/$($gate.Manifest)" ./
            } finally {
              git worktree remove --force $gate.Path
              if ($LASTEXITCODE) { throw "Cannot remove $($gate.Path)" }
            }
          }
          python custom/cumulative/verify-source.py
          if ($LASTEXITCODE) { throw 'Cumulative source union or parent ancestry verification failed' }
      - name: Test script installer preflight and rollback on authored fixtures
        shell: powershell
        run: |
          ./custom/gameplay-responsiveness/Test-Installer.ps1 -InstallerScript ./custom/gameplay-responsiveness/Install-Fix.ps1 -WrapperScript ./custom/gameplay-responsiveness/Install-All.ps1 -TestRoot ./installer-fixtures -ReportPath ./gameplay-installer-tests.json
          if ($LASTEXITCODE) { throw 'Script installer regression tests failed' }
      - name: Test settings editing and rollback in Windows PowerShell
        shell: powershell
        run: |
          ./custom/gameplay-responsiveness/Test-Settings.ps1
          if ($LASTEXITCODE) { throw 'Windows PowerShell settings tests failed' }
      - name: Test settings editing and rollback in PowerShell 7
        shell: pwsh
        run: |
          ./custom/gameplay-responsiveness/Test-Settings.ps1
          if ($LASTEXITCODE) { throw 'PowerShell 7 settings tests failed' }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test notification placement before compiling the engine
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX custom/message-position/test-position.cpp /Fe:message-position-tests.exe
          if ($LASTEXITCODE) { throw 'Notification geometry test compilation failed' }
          ./message-position-tests.exe | Tee-Object message-position-tests.txt
          if ($LASTEXITCODE) { throw 'Notification geometry regressions failed' }
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Apply lookup-only repair and verify waiting-stage rollback
        shell: pwsh
        run: |
          python custom/loading-repair/apply.py
          if ($LASTEXITCODE) { throw 'Source baseline/patch validation failed' }
          python custom/loading-repair/check-integration.py
          if ($LASTEXITCODE) { throw 'Waiting-stage rollback/source validation failed' }
          python custom/cumulative/verify-source.py --after-lookup
          if ($LASTEXITCODE) { throw 'Final compiled source differs from the verified cumulative union' }
          git diff --check
          if ($LASTEXITCODE) { throw 'Invalid source diff' }
          git diff --binary --output=loading-repair-applied.patch -- apps/
      - name: Record dependency versions
        shell: bash
        run: sed '/^\s*#/d; /^\s*$/d' CI/deps_versions.msvc.sh >> "$GITHUB_ENV"
      - name: Download verified dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps, deps/Qt | Out-Null
          Set-Location deps
          $manifest = "vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}-manifest.txt"
          curl --fail --retry 3 -L -o "$manifest" "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/$manifest"
          if ($LASTEXITCODE) { throw 'Dependency manifest download failed' }
          $lines = Get-Content "$manifest"
          $parts = -split $lines[1]
          curl --fail --retry 3 -L -o "$($parts[1])" "$($lines[0])"
          if ($LASTEXITCODE) { throw 'Dependency archive download failed' }
          if ((Get-FileHash $parts[1] -Algorithm SHA512).Hash -ne $parts[0]) { throw 'Dependency hash mismatch' }
          7z x -y "-ovcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}" $parts[1]
          if ($LASTEXITCODE) { throw 'Dependency extraction failed' }
      - uses: actions/cache@v5
        id: qt-cache
        with:
          path: deps/Qt/${{ env.QT_VER }}/msvc2019_64
          key: qt-cache-${{ env.QT_VER }}-msvc2019_64-v1
      - name: Download Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: deps/Qt
        run: |
          curl --fail --retry 3 -L -o aqt_x64.exe https://github.com/miurahr/aqtinstall/releases/download/v3.1.15/aqt_x64.exe
          if ($LASTEXITCODE) { throw 'Qt installer download failed' }
          ./aqt_x64.exe install-qt windows desktop ${{ env.QT_VER }} win64_msvc2019_64
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
      - name: Configure Release build with existing diagnostic cache
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release
          -D CMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/scripts/buildsystems/vcpkg.cmake'
          -D CMAKE_PREFIX_PATH='${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64'
          -D CMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG"
          -D "CMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF /INCREMENTAL:NO"
          -D LuaJit_INCLUDE_DIR='${{ github.workspace }}/deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/installed/x64-windows/include/luajit'
          -D LuaJit_LIBRARY='${{ github.workspace }}/deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/installed/x64-windows/lib/lua51.lib'
          -D BUILD_BENCHMARKS=OFF -D BUILD_COMPONENTS_TESTS=ON -D BUILD_OPENMW_TESTS=ON
          -D BUILD_OPENCS_TESTS=OFF -D BUILD_OPENCS=OFF -D BUILD_ESSIMPORTER=OFF -D BUILD_BSATOOL=OFF
          -D BUILD_ESMTOOL=OFF -D BUILD_NIFTEST=OFF -D BUILD_BULLETOBJECTTOOL=OFF
          -D OPENMW_USE_SYSTEM_SQLITE3=OFF -D OPENMW_USE_SYSTEM_YAML_CPP=OFF -D OPENMW_LTO_BUILD=ON
          -D PRECOMPILE_HEADERS_WITH_MSVC=OFF -D CMAKE_POLICY_DEFAULT_CMP0141=NEW
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -D CMAKE_C_COMPILER_LAUNCHER=sccache
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache -D CMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Compile Lua cache change and lifecycle tests first
        shell: pwsh
        run: >
          cmake --build build --target
          components/CMakeFiles/components.dir/lua/scripttracker.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/luamanagerimp.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/lua/testscriptscontainer.cpp.obj
      - name: Compile lookup change first
        shell: pwsh
        run: cmake --build build --target apps/openmw/CMakeFiles/openmw-lib.dir/mwworld/worldmodel.cpp.obj
      - name: Compile message position and preserved tooltip bridge first
        shell: pwsh
        run: >
          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/messagebox.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/messagepositioncontrols.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testmessagepositioncontrols.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/windowmanagerimp.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/uibindings.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwscript/interpretercontext.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwscript/scriptmanagerimp.cpp.obj
      - name: Compile preserved colour implementation and focused regressions first
        shell: pwsh
        run: >
          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/bookpage.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/dialogueformatting.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/dialoguecolourcontrols.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/dialogue.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/journalbooks.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/journalwindow.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/settingswindow.cpp.obj
          components/CMakeFiles/components.dir/widgets/list.cpp.obj
          components/CMakeFiles/components.dir/widgets/imagebutton.cpp.obj
          apps/launcher/CMakeFiles/openmw-launcher.dir/settingspage.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/settings/testvalues.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/test_journaltypography.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testdialogueformatting.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testdialoguecolourcontrols.cpp.obj
          components/CMakeFiles/components.dir/misc/dialoguetext.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/misc/testdialoguetext.cpp.obj
      - name: Build engine and regression tests
        run: cmake --build build --target openmw openmw-launcher openmw-wizard openmw-iniimporter openmw-navmeshtool openmw-tests components-tests
      - name: Prepare test DLLs
        shell: pwsh
        run: |
          $deps = 'deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/installed/x64-windows/bin'
          Copy-Item "$deps/Release/MyGUIEngine.dll" build/
          Copy-Item "$deps/*.dll" build/
          Get-ChildItem "$deps/osgPlugins-3.6.5" -Filter *.dll -Recurse | Copy-Item -Destination build/
          $qt = 'deps/Qt/${{ env.QT_VER }}/msvc2019_64'
          foreach ($dll in 'Core','Gui','Network','OpenGL','OpenGLWidgets','Widgets','Svg') {
            Copy-Item "$qt/bin/Qt6$dll.dll" build/
          }
          foreach ($plugin in 'styles/qwindowsvistastyle.dll','platforms/qwindows.dll','imageformats/qsvg.dll','iconengines/qsvgicon.dll') {
            New-Item -ItemType Directory -Force (Split-Path "build/$plugin") | Out-Null
            Copy-Item "$qt/plugins/$plugin" "build/$plugin"
          }
      - name: All engine tests and four lookup configurations before packaging
        shell: pwsh
        run: |
          ./build/components-tests.exe --gtest_output=xml:components-tests.xml
          if ($LASTEXITCODE) { throw 'Component regressions failed' }
          ./build/openmw-tests.exe --gtest_output=xml:openmw-tests.xml
          if ($LASTEXITCODE) { throw 'Engine regressions failed' }
          try {
            foreach ($mode in @(@('1','1','1'), @('1','1','0'), @('0','1','1'), @('1','0','0'))) {
              $env:OPENMW_CELL_ID_INDEX = $mode[0]
              $env:OPENMW_WORLD_CELL_INDEX = $mode[1]
              $env:OPENMW_WORLD_CELL_CANDIDATES = $mode[2]
              $label = $mode -join '-'
              ./build/openmw-tests.exe --gtest_filter=CellLookupTest.*:WorldCellLookupTest.* "--gtest_output=xml:lookup-$label.xml"
              if ($LASTEXITCODE) { throw "Lookup configuration failed: $mode" }
            }
          } finally {
            Remove-Item Env:OPENMW_CELL_ID_INDEX,Env:OPENMW_WORLD_CELL_INDEX,Env:OPENMW_WORLD_CELL_CANDIDATES -ErrorAction SilentlyContinue
          }
      - name: Package only after test success
        shell: pwsh
        run: |
          cmake --install build --prefix install
          if ($LASTEXITCODE) { throw 'Installation failed' }
          Remove-Item install/bin,install/_deps -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem install -Filter *.pdb -Recurse | Remove-Item -Force
          Copy-Item loading-repair-source-manifest.json,loading-repair-applied.patch install/
          Copy-Item custom/loading-repair/README.md install/LOADING-REPAIR.md
          Copy-Item custom/journal-typography/README.md install/JOURNAL-TYPOGRAPHY.md
          Copy-Item custom/dialogue-colours/README.md install/DIALOGUE-COLOURS.md
          Copy-Item custom/shrine-tooltips/README.md install/SHRINE-TOOLTIPS.md
          Copy-Item custom/gameplay-responsiveness/README.md install/GAMEPLAY-RESPONSIVENESS.md
          Copy-Item gameplay-responsiveness-source-manifest.json install/
          Copy-Item custom/message-position/README.md install/MESSAGE-POSITION.md
          Copy-Item custom/cumulative/README.md install/CUMULATIVE-UPGRADE.md
          Copy-Item message-position-source-manifest.json,message-position-tests.txt install/
          Copy-Item cumulative-source-manifest.json,cumulative-build-source-manifest.json install/
          Copy-Item lookup-*.xml install/
          Copy-Item shrine-tooltips-source-manifest.json install/
          Copy-Item dialogue-colours-source-manifest.json,components-tests.xml,openmw-tests.xml install/
          "Commit ${{ env.CUMULATIVE_COMMIT }}`nCumulative source union: cumulative-source-manifest.json`nCompiled source after lookup patch: cumulative-build-source-manifest.json`nPreserved accepted baseline 1b78b9c1a566b91bbe1576387842625f3ae509d1`nHistorical feature source manifests retain their original commits`nNative tests use the bundled CI Lua runtime; custom replacements and gameplay remain untested`nComplete standard engine package includes its bootstrap and runtime; user modlist configuration and optional FG remain separate" | Set-Content install/CI-ID.txt
          python custom/cumulative/prepare-upgrade.py install
          if ($LASTEXITCODE) { throw 'Complete package runtime or defaults verification failed' }
          ./custom/cumulative/check-startup.ps1 -PackageRoot install -EvidenceRoot package-startup
          Copy-Item -LiteralPath package-startup -Destination install/verification/startup -Recurse
          python custom/dialogue-colours/package-manifest.py install
          if ($LASTEXITCODE) { throw 'Package inventory validation failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: openmw-cumulative-windows-complete-${{ env.CUMULATIVE_COMMIT }}
          path: install/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cumulative-native-evidence-${{ env.CUMULATIVE_COMMIT }}
          path: |
            gameplay-installer-tests.json
            cumulative-source-manifest.json
            cumulative-build-source-manifest.json
            message-position-source-manifest.json
            message-position-tests.txt
            lookup-*.xml
            install/UPGRADE-PRESERVATION.json
            install/verification/CI-PACKAGE-SHA256.json
            package-startup/**
            gameplay-responsiveness-source-manifest.json
            shrine-tooltips-source-manifest.json
            dialogue-colours-source-manifest.json
            components-tests.xml
            openmw-tests.xml
            install/PACKAGE-SHA256.json
            loading-repair-source-manifest.json
            loading-repair-applied.patch
            build/CMakeCache.txt
            build/**/*.log
            build/compile_commands.json

  GLRegression:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Install headless GL test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl1 libgl1-mesa-dri g++
      - name: Reproduce and verify loading progress and framebuffer retention
        run: python3 custom/frame-generation/tests/frame_contents_gl.py /usr/include
  FrameGeneration:
    if: github.head_ref != 'fix/windows-package-20261106'
    needs: GLRegression
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure and build modified Frame Generation
        shell: pwsh
        run: |
          cmake -S custom/frame-generation -B fg-build -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE) { throw "FG configure failed" }
          cmake --build fg-build --config Release --parallel
          if ($LASTEXITCODE) { throw "FG build failed" }
      - name: Verify DLL and assemble install package with source
        shell: pwsh
        run: |
          cl /nologo /EHsc custom/frame-generation/tests/proxy_smoke.cpp /Fe:fg-proxy-test.exe
          if ($LASTEXITCODE) { throw "Smoke test compile failed" }
          ./fg-proxy-test.exe "$PWD/fg-build/Release/version.dll"
          if ($LASTEXITCODE) { throw "DLL load/export forwarding test failed" }
          New-Item -ItemType Directory -Force fg-package/source | Out-Null
          Copy-Item fg-build/Release/version.dll fg-package/
          Copy-Item custom/frame-generation/openmw_fg.ini fg-package/openmw_fg.example.ini
          Copy-Item custom/frame-generation/INSTALL-CUSTOM.txt fg-package/README.txt
          Copy-Item custom/frame-generation/PATCH_NOTES.txt fg-package/
          Copy-Item custom/frame-generation/LICENSE fg-package/
          Copy-Item custom/frame-generation/LOADING-CONTINUITY-AUDIT.md fg-package/
          Copy-Item custom/frame-generation/LOADING-PROGRESS-REPAIR.md fg-package/
          Copy-Item custom/frame-generation/SHUTDOWN-REPAIR.md fg-package/
          Copy-Item custom/frame-generation/* fg-package/source/ -Recurse
          "Commit ${{ env.CUMULATIVE_COMMIT }}`nRun ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n" | Set-Content fg-package/BUILD-ID.txt
          Get-FileHash fg-package/version.dll -Algorithm SHA256 | Format-List | Out-File fg-package/SHA256.txt
      - uses: actions/upload-artifact@v6
        with:
          name: cumulative-frame-generation-validation-${{ env.CUMULATIVE_COMMIT }}
          path: fg-package/
          if-no-files-found: error

  HistoricalInstallerTools:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Test authored installer with dummy files on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./custom/gameplay-fix-installer/Test-Installer.ps1 -InstallerScript ./custom/gameplay-fix-installer/Install-Fix.ps1 -TestRoot "$env:RUNNER_TEMP\OpenMW installer checks" -ReportPath "$env:GITHUB_WORKSPACE\installer-test-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-fix-installer-verification-${{ env.CUMULATIVE_COMMIT }}
          path: |
            installer-test-report.json
            ${{ runner.temp }}/OpenMW installer checks/**/invoke-*.json
            ${{ runner.temp }}/OpenMW installer checks/**/invoke-*.stdout.txt
            ${{ runner.temp }}/OpenMW installer checks/**/invoke-*.stderr.txt
            ${{ runner.temp }}/OpenMW installer checks/**/receipt.json
          if-no-files-found: error

  GameplaySourceCollector:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Test read-only collector with authored dummy files on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./custom/gameplay-source-collector/Test-Collector.ps1 -CollectorScript ./custom/gameplay-source-collector/Collect-Sources.ps1 -TestRoot "$env:RUNNER_TEMP\OpenMW collector checks" -ReportPath "$env:GITHUB_WORKSPACE\collector-test-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-source-collector-verification-${{ env.CUMULATIVE_COMMIT }}
          path: |
            collector-test-report.json
            ${{ runner.temp }}/OpenMW collector checks/**/invoke-*.json
            ${{ runner.temp }}/OpenMW collector checks/**/invoke-*.stdout.txt
            ${{ runner.temp }}/OpenMW collector checks/**/invoke-*.stderr.txt
          if-no-files-found: error

  PerformanceCaptureFollowup:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Check only changed collection functions and dummy installer orchestration
        shell: powershell
        run: |
          & ./custom/performance-capture-followup/Test-CaptureFollowup.ps1 -CaptureScript ./custom/performance-capture-followup/Start-Capture.ps1 -InstallWrapper ./custom/performance-capture-followup/Install-All.ps1 -TestRoot "$env:RUNNER_TEMP\OpenMW followup checks" -ReportPath "$env:GITHUB_WORKSPACE\followup-test-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-capture-followup-verification-${{ env.CUMULATIVE_COMMIT }}
          path: |
            followup-test-report.json
            ${{ runner.temp }}/OpenMW followup checks/**/invoke.json
            ${{ runner.temp }}/OpenMW followup checks/**/invoke.stdout.txt
            ${{ runner.temp }}/OpenMW followup checks/**/invoke.stderr.txt
          if-no-files-found: error

  PerformanceCapture:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Exercise collector on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./custom/performance-capture/Test-Capture.ps1 -CaptureScript ./custom/performance-capture/Start-Capture.ps1 -TestRoot "$env:RUNNER_TEMP\OpenMW capture smoke" -ReportPath "$env:GITHUB_WORKSPACE\capture-test-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-capture-verification-${{ env.CUMULATIVE_COMMIT }}
          path: |
            capture-test-report.json
            ${{ runner.temp }}/OpenMW capture smoke/captures/**/session.json
            ${{ runner.temp }}/OpenMW capture smoke/captures/**/trace-validation.json
            ${{ runner.temp }}/OpenMW capture smoke/captures/**/warnings.json
          if-no-files-found: error

  RepairPackage:
    if: github.head_ref == 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
          fetch-depth: 100
      - name: Download the two exact original CI archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $artifacts = @(
            @{ Id = 13537633072; Run = 42279447874; Commit = '29022d6176d82b9281075cc2189d19b11ebce463';
               Bytes = 63952619; Sha256 = 'b93a17c47066473232e07460c73eb4077f2df066e5e129f3d6515453a963eb2e'; File = 'current.zip' },
            @{ Id = 13520058314; Run = 42240697023; Commit = '5b84be8c1b8fc283b58755127e1aa078d7f2b4a0';
               Bytes = 64186799; Sha256 = '38298fddd7e5c9f0aa53171ac53b97298645055337122626936c0ffed719b917'; File = 'recovery.zip' }
          )
          New-Item -ItemType Directory -Path downloads | Out-Null
          $verified = @()
          foreach ($artifact in $artifacts) {
            $uri = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$($artifact.Id)"
            $metadata = Invoke-RestMethod -Uri $uri -Headers $headers
            if ($metadata.id -ne $artifact.Id -or $metadata.workflow_run.id -ne $artifact.Run -or
                $metadata.workflow_run.head_sha -ne $artifact.Commit -or $metadata.expired -or
                $metadata.size_in_bytes -ne $artifact.Bytes -or $metadata.digest -ne "sha256:$($artifact.Sha256)") {
              throw "Unexpected artifact metadata: $($artifact.Id)"
            }
            $metadata | ConvertTo-Json -Depth 12 | Set-Content "downloads/$($artifact.Id).metadata.json" -Encoding utf8
            $destination = "downloads/$($artifact.File)"
            Invoke-WebRequest -Uri "$uri/zip" -Headers $headers -OutFile $destination
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $artifact.Sha256 -or (Get-Item -LiteralPath $destination).Length -ne $artifact.Bytes) {
              throw "CI archive digest or size mismatch: $($artifact.Id)"
            }
            $verified += @{ artifact_id = $artifact.Id; run_id = $artifact.Run; engine_commit = $artifact.Commit;
                            sha256 = $hash; bytes = $artifact.Bytes; verified = $true }
          }
          $verified | ConvertTo-Json -Depth 5 | Set-Content downloads/verification.json -Encoding utf8
      - name: Restore complete package without rebuilding the engine
        shell: pwsh
        run: |
          python custom/cumulative/restore-package.py --current downloads/current.zip --recovery downloads/recovery.zip --output install
          if ($LASTEXITCODE) { throw 'Exact original CI file restoration failed' }
      - name: Exercise real startup and the missing-bootstrap regression
        shell: pwsh
        run: |
          ./custom/cumulative/check-startup.ps1 -PackageRoot install -EvidenceRoot package-startup -NegativeControl
          Copy-Item -LiteralPath package-startup -Destination install/verification/startup -Recurse
          python custom/dialogue-colours/package-manifest.py install
          if ($LASTEXITCODE) { throw 'Complete package inventory validation failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: openmw-cumulative-windows-complete-29022d6176d82b9281075cc2189d19b11ebce463
          path: install/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: package-startup-evidence-${{ env.CUMULATIVE_COMMIT }}
          path: |
            package-startup/**
            downloads/*.metadata.json
            downloads/verification.json
            install/PACKAGE-REPAIR.json
            install/PACKAGE-SHA256.json
            install/CI-ID.txt
            install/verification/CI-PACKAGE-SHA256.json
            install/verification/original-upgrade/**
          if-no-files-found: error
