          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/bookpage.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/dialogueformatting.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/dialoguecolourcontrols.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/dialogue.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/journalbooks.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/journalwindow.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/settingswindow.cpp.obj
          components/CMakeFiles/components.dir/widgets/list.cpp.obj
          components/CMakeFiles/components.dir/widgets/imagebutton.cpp.obj
          apps/launcher/CMakeFiles/openmw-launcher.dir/settingspage.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/settings/testvalues.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/test_journaltypography.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testdialogueformatting.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testdialoguecolourcontrols.cpp.obj
          components/CMakeFiles/components.dir/misc/dialoguetext.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/misc/testdialoguetext.cpp.obj
      - name: Compile native map icons and save regressions first
        if: steps.existing_engine.outputs.reused != 'true'
        run: >-
          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/mapwindow.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/mapiconcontrols.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/settingswindow.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/esm3/testlocationmarkers.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/mapmarkers/testclassification.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testmessagepositioncontrols.cpp.obj
      - name: Compile native travel, key and cleared-dungeon integration first
        if: steps.existing_engine.outputs.reused != 'true'
        run: >-
          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/traveltooltip.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/traveltooltipdata.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/traveltooltipview.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/tooltipcontrols.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/travelwindow.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/tooltips.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwclass/door.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwclass/container.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwmechanics/actors.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwmechanics/mechanicsmanagerimp.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwstate/statemanagerimp.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwworld/scene.cpp.obj
          components/CMakeFiles/components.dir/esm3/dungeonstates.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/esm3/testdungeonstates.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testtraveltooltipdata.cpp.obj
      - name: Prepare test DLLs
        shell: pwsh
        run: |
          $deps = 'deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/installed/x64-windows/bin'
          Copy-Item "$deps/Release/MyGUIEngine.dll" build/
          Copy-Item "$deps/*.dll" build/
          Get-ChildItem "$deps/osgPlugins-3.6.5" -Filter *.dll -Recurse | Copy-Item -Destination build/
          $qt = 'deps/Qt/${{ env.QT_VER }}/msvc2019_64'
          foreach ($dll in 'Core','Gui','Network','OpenGL','OpenGLWidgets','Widgets','Svg') {
            Copy-Item "$qt/bin/Qt6$dll.dll" build/
          }
          foreach ($plugin in 'styles/qwindowsvistastyle.dll','platforms/qwindows.dll','imageformats/qsvg.dll','iconengines/qsvgicon.dll') {
            New-Item -ItemType Directory -Force (Split-Path "build/$plugin") | Out-Null
            Copy-Item "$qt/plugins/$plugin" "build/$plugin"
          }
      - name: Restore matching compiled companions for packaging-only verification
        id: existing_tools
        if: steps.existing_engine.outputs.reused == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python custom/combined-performance/reuse-windows-engine.py --companion-tools
      - name: Build the Construction Set and all public command-line tools
        id: distribution_tools
        if: steps.existing_tools.outputs.reused != 'true'
        shell: pwsh
        run: >
          cmake --build build --target openmw-cs openmw-essimporter bsatool esmtool niftest openmw-bulletobjecttool
      - name: Run component regressions before full engine linking
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: |
          cmake --build build --target components-tests
          if ($LASTEXITCODE) { throw 'Component regression build failed' }
          ./build/components-tests.exe --gtest_output=xml:components-tests-early.xml
          if ($LASTEXITCODE) { throw 'Early component regressions failed' }
      - name: Build engine and regression tests
        if: steps.existing_engine.outputs.reused != 'true'
        run: cmake --build build --target openmw openmw-launcher openmw-wizard openmw-iniimporter openmw-navmeshtool openmw-tests components-tests
      - name: All engine tests, UI fallback modes and four lookup configurations before packaging
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: |
          ./build/components-tests.exe --gtest_output=xml:components-tests.xml
          $componentTestExit = $LASTEXITCODE
          Remove-Item Env:OPENMW_LUA_UI_LEGACY_LAYOUT,Env:OPENMW_LUA_UI_LEGACY_UPDATES,Env:OPENMW_COMBINED_PERFORMANCE,Env:OPENMW_LUA_CELL_QUERY_CACHE -ErrorAction SilentlyContinue
          ./build/openmw-tests.exe --gtest_output=xml:openmw-tests.xml
          if ($LASTEXITCODE) { throw 'Engine regressions failed' }
          if ($componentTestExit) { throw 'Component regressions failed' }
          try {
            $env:OPENMW_LUA_UI_LEGACY_LAYOUT = '1'
            ./build/openmw-tests.exe --gtest_filter=LuaUiLayoutTest.*:LuaUiPropertyTest.* --gtest_output=xml:lua-ui-legacy-tests.xml
            if ($LASTEXITCODE) { throw 'Legacy native layout and Image inheritance regressions failed' }
          } finally {
            Remove-Item Env:OPENMW_LUA_UI_LEGACY_LAYOUT -ErrorAction SilentlyContinue
          }
          python custom/town-performance/verify-layout-parity.py openmw-tests.xml lua-ui-legacy-tests.xml lua-ui-layout-parity.json
          if ($LASTEXITCODE) { throw 'Required native UI regressions or layout/Image parity verification failed' }
          try {
            $env:OPENMW_LUA_UI_LEGACY_UPDATES = '1'
            ./build/openmw-tests.exe --gtest_filter=LuaUiLayoutTest.*:LuaUiPropertyTest.* --gtest_output=xml:lua-ui-legacy-updates-tests.xml
            if ($LASTEXITCODE) { throw 'Inherited native update traversal regressions failed' }
          } finally {
            Remove-Item Env:OPENMW_LUA_UI_LEGACY_UPDATES -ErrorAction SilentlyContinue
          }
          try {
            $env:OPENMW_COMBINED_PERFORMANCE = '0'
            ./build/openmw-tests.exe --gtest_filter=LuaUiLayoutTest.*:LuaUiPropertyTest.*:MWLuaMagicBindingsTest.nativeQueryFactoriesMatchLuaAdapterCallsAndMasterMode --gtest_output=xml:combined-performance-off-tests.xml
            if ($LASTEXITCODE) { throw 'Same-executable inherited fallback regressions failed' }
          } finally {
            Remove-Item Env:OPENMW_COMBINED_PERFORMANCE -ErrorAction SilentlyContinue
          }
          python custom/town-performance/verify-combined-layout.py openmw-tests.xml lua-ui-legacy-updates-tests.xml combined-performance-off-tests.xml combined-layout-parity.json
          if ($LASTEXITCODE) { throw 'Combined native UI state or fallback parity failed' }
          python custom/combined-performance/tests/verify-native-jobs.py components-tests.xml openmw-tests.xml native-jobs-tests.json
          if ($LASTEXITCODE) { throw 'Native job regressions did not run successfully' }
          python custom/combined-performance/verify-native.py openmw-tests.xml combined-performance-off-tests.xml combined-native-tests.json
          if ($LASTEXITCODE) { throw 'Required combined query regressions or fallback factory behavior did not execute' }
          try {
            foreach ($mode in @(@('1','1','1'), @('1','1','0'), @('0','1','1'), @('1','0','0'))) {
              $env:OPENMW_CELL_ID_INDEX = $mode[0]
              $env:OPENMW_WORLD_CELL_INDEX = $mode[1]
              $env:OPENMW_WORLD_CELL_CANDIDATES = $mode[2]
              $label = $mode -join '-'
              ./build/openmw-tests.exe --gtest_filter=CellLookupTest.*:WorldCellLookupTest.* "--gtest_output=xml:lookup-$label.xml"
              if ($LASTEXITCODE) { throw "Lookup configuration failed: $mode" }
            }
          } finally {
            Remove-Item Env:OPENMW_CELL_ID_INDEX,Env:OPENMW_WORLD_CELL_INDEX,Env:OPENMW_WORLD_CELL_CANDIDATES -ErrorAction SilentlyContinue
          }
      - name: Require executed native tooltip tests
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: |
          python custom/native-tooltips/verify-tests.py --controls map-icon-controls-early.xml --components components-tests.xml --engine openmw-tests.xml
          if ($LASTEXITCODE) { throw 'Required tooltip forms, selection or save regressions did not execute successfully' }
      - name: Package only after test success
        if: steps.existing_engine.outputs.reused != 'true'
        id: package
        shell: pwsh
        run: |
          cmake --install build --prefix install
          if ($LASTEXITCODE) { throw 'Installation failed' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'installed=true'
          Remove-Item install/bin,install/_deps -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem install -Filter *.pdb -Recurse | Remove-Item -Force
          Copy-Item loading-repair-source-manifest.json,loading-repair-applied.patch install/
          Copy-Item custom/loading-repair/README.md install/LOADING-REPAIR.md
          Copy-Item custom/journal-typography/README.md install/JOURNAL-TYPOGRAPHY.md
          Copy-Item custom/dialogue-colours/README.md install/DIALOGUE-COLOURS.md
          Copy-Item custom/shrine-tooltips/README.md install/SHRINE-TOOLTIPS.md
          Copy-Item custom/gameplay-responsiveness/README.md install/GAMEPLAY-RESPONSIVENESS.md
          Copy-Item gameplay-responsiveness-source-manifest.json install/
          Copy-Item custom/message-position/README.md install/MESSAGE-POSITION.md
          Copy-Item custom/cumulative/README.md install/CUMULATIVE-UPGRADE.md
          Copy-Item message-position-source-manifest.json,message-position-tests.txt install/
          Copy-Item cumulative-source-manifest.json,cumulative-build-source-manifest.json install/
          Copy-Item menu-qol-source-manifest.json,menu-qol-build-source-manifest.json install/
          Copy-Item custom/menu-qol/README.md install/REST-TIME-AND-CONTINUE.md
          Copy-Item deleveler-source-manifest.json,deleveler-build-source-manifest.json install/
          Copy-Item custom/deleveler/README.md install/NATIVE-DELEVELER.md
          Copy-Item town-performance-source-manifest.json,town-performance-build-source-manifest.json install/
          Copy-Item custom/town-performance/README.md install/TOWN-PERFORMANCE.md
          Copy-Item custom/map-icons/README.md install/NATIVE-MAP-ICONS.md
          Copy-Item custom/native-tooltips/README.md install/NATIVE-TOOLTIPS.md
          Copy-Item native-tooltip-tests.json install/
          python custom/map-icons/verify-classification.py --binary ./map-icons-classifier.exe --receipt map-icons-package.json --resources install/resources/vfs
          if ($LASTEXITCODE) { throw 'Installed map icon resource verification failed' }
          Copy-Item map-icons-classification.json,map-icons-package.json install/
          Copy-Item map-icon-controls-early.xml,components-tests-early.xml install/
          Copy-Item lua-ui-legacy-tests.xml,lua-ui-layout-parity.json install/
          New-Item -ItemType Directory -Force install/tools/town-performance/capture | Out-Null
          Copy-Item custom/town-performance/Start-Comparison.ps1,custom/town-performance/Compare-Optimized.cmd,custom/town-performance/Compare-Legacy-Layout.cmd install/tools/town-performance/
          Copy-Item custom/performance-capture-followup/Start-Capture.ps1 install/tools/town-performance/capture/
          Copy-Item lookup-*.xml install/
          Copy-Item shrine-tooltips-source-manifest.json install/
          Copy-Item dialogue-colours-source-manifest.json,components-tests.xml,openmw-tests.xml install/
          "Commit ${{ env.CUMULATIVE_COMMIT }}`nCombined native performance: UI geometry reuse, live compiled magic queries and shared typed cell snapshots; see COMBINED-PERFORMANCE.md`nFour optional mod adapters, TES3 actor neighbours, paging model decoding and same-executable cumulative comparison included`nNative Travel Tooltips, If The Key Fits and Been There, Done That; Options -> Tooltips; see NATIVE-TOOLTIPS.md`nNative world map location icons preserved; no AWM dependency; see NATIVE-MAP-ICONS.md`nLua UI image inheritance repair: actual Image regression required in optimized and legacy modes`nExperimental performance candidates retained: gameplay speedup has not been accepted`nTown performance source: town-performance-source-manifest.json`nCompiled source after lookup patch: town-performance-build-source-manifest.json`nPreserved combined Continue and native deleveler source ce3d5a2e981999df432cf8df416352cc85842e97`nHistorical feature source manifests retain their original commits`nNative tests use the bundled CI Lua runtime; installed custom replacements, in-game appearance and game FPS remain untested`nComplete standard engine package includes bootstrap and runtime; user modlist configuration and optional FG remain separate" | Set-Content install/CI-ID.txt
          python custom/combined-performance/prepare-package.py install
          if ($LASTEXITCODE) { throw 'Combined candidate tools, adapters or native verification packaging failed' }
          python custom/cumulative/prepare-upgrade.py install --town-performance
          if ($LASTEXITCODE) { throw 'Complete package runtime or defaults verification failed' }
          ./custom/cumulative/check-startup.ps1 -PackageRoot install -EvidenceRoot package-startup
          Copy-Item -LiteralPath package-startup -Destination install/verification/startup -Recurse
      - name: Verify the full portable Windows distribution
        id: distribution
        shell: pwsh
        run: |
          ./custom/combined-performance/stage-msvc-runtime.ps1 -PackageRoot install
          $options = @()
          if ('${{ steps.existing_engine.outputs.reused }}' -eq 'true') { $options += '--preserve-existing' }
          python custom/combined-performance/complete-windows-distribution.py build install @options
          if ($LASTEXITCODE) { throw 'Windows tools, public files or dependencies failed verification' }
          ./custom/cumulative/check-startup.ps1 -PackageRoot install -EvidenceRoot distribution-startup
          Copy-Item -LiteralPath distribution-startup -Destination install/verification/distribution-startup -Recurse
          python custom/dialogue-colours/package-manifest.py install
          if ($LASTEXITCODE) { throw 'Final Windows distribution inventory validation failed' }
      - uses: actions/upload-artifact@v6
        with:
          name: openmw-parallel-native-jobs-windows-complete-${{ env.CUMULATIVE_COMMIT }}
          path: install/*
          if-no-files-found: error
      - name: Retain compiled companion tools if later packaging verification fails
        if: failure() && steps.distribution_tools.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: windows-tools-diagnostics-${{ env.CUMULATIVE_COMMIT }}
          path: |
            build/openmw-cs.exe
            build/openmw-essimporter.exe
            build/bsatool.exe
            build/esmtool.exe
            build/niftest.exe
            build/openmw-bulletobjecttool.exe
            build/defaults-cs.bin
          retention-days: 3
          if-no-files-found: error
      - name: Preserve unverified files for packaging failure recovery
        if: failure() && steps.package.outputs.installed == 'true' && steps.package.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: UNVERIFIED-town-performance-package-recovery-${{ env.CUMULATIVE_COMMIT }}
          path: install/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cumulative-native-evidence-${{ env.CUMULATIVE_COMMIT }}
          path: |
            install/verification/WINDOWS-DISTRIBUTION.json
            distribution-startup/
            gameplay-installer-tests.json
            cumulative-source-manifest.json
            cumulative-build-source-manifest.json
            menu-qol-source-manifest.json
            menu-qol-build-source-manifest.json
            deleveler-source-manifest.json
            deleveler-build-source-manifest.json
            town-performance-source-manifest.json
            town-performance-build-source-manifest.json
            message-position-source-manifest.json
            message-position-tests.txt
            native-tooltip-tests.json
            map-icons-classification.json
            map-icons-package.json
            map-icon-controls-early.xml
            components-tests-early.xml
            lookup-*.xml
            install/UPGRADE-PRESERVATION.json
            install/verification/CI-PACKAGE-SHA256.json
            package-startup/**
            gameplay-responsiveness-source-manifest.json
            shrine-tooltips-source-manifest.json
            dialogue-colours-source-manifest.json
            components-tests.xml
            openmw-tests.xml
            lua-ui-legacy-tests.xml
            lua-ui-layout-parity.json
            sanemagic-adapter-parity.json
            combined-launcher-windows-powershell.json
            combined-launcher-pwsh.json
            combined-native-tests.json
            combined-layout-parity.json
            lua-ui-legacy-updates-tests.xml
            combined-performance-off-tests.xml
            native-job-adapter-parity.json
            native-jobs-tests.json
            install/COMBINED-PACKAGE.json
            install/PACKAGE-SHA256.json
            loading-repair-source-manifest.json
            loading-repair-applied.patch
            build/CMakeCache.txt
            build/**/*.log
            build/compile_commands.json

  GLRegression:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Install headless GL test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libegl1 libgl1-mesa-dri g++
      - name: Reproduce and verify loading progress and framebuffer retention
        run: python3 custom/frame-generation/tests/frame_contents_gl.py /usr/include
  FrameGeneration:
    if: github.head_ref != 'fix/windows-package-20261106'
    needs: GLRegression
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure and build modified Frame Generation
        shell: pwsh
        run: |
          cmake -S custom/frame-generation -B fg-build -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE) { throw "FG configure failed" }
          cmake --build fg-build --config Release --parallel
          if ($LASTEXITCODE) { throw "FG build failed" }
      - name: Verify DLL and assemble install package with source
        shell: pwsh
        run: |
          cl /nologo /EHsc custom/frame-generation/tests/proxy_smoke.cpp /Fe:fg-proxy-test.exe
          if ($LASTEXITCODE) { throw "Smoke test compile failed" }
          ./fg-proxy-test.exe "$PWD/fg-build/Release/version.dll"
          if ($LASTEXITCODE) { throw "DLL load/export forwarding test failed" }
          New-Item -ItemType Directory -Force fg-package/source | Out-Null
          Copy-Item fg-build/Release/version.dll fg-package/
          Copy-Item custom/frame-generation/openmw_fg.ini fg-package/openmw_fg.example.ini
          Copy-Item custom/frame-generation/INSTALL-CUSTOM.txt fg-package/README.txt
          Copy-Item custom/frame-generation/PATCH_NOTES.txt fg-package/
          Copy-Item custom/frame-generation/LICENSE fg-package/
          Copy-Item custom/frame-generation/LOADING-CONTINUITY-AUDIT.md fg-package/
          Copy-Item custom/frame-generation/LOADING-PROGRESS-REPAIR.md fg-package/
          Copy-Item custom/frame-generation/SHUTDOWN-REPAIR.md fg-package/
          Copy-Item custom/frame-generation/* fg-package/source/ -Recurse
          "Commit ${{ env.CUMULATIVE_COMMIT }}`nRun ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n" | Set-Content fg-package/BUILD-ID.txt
          Get-FileHash fg-package/version.dll -Algorithm SHA256 | Format-List | Out-File fg-package/SHA256.txt
      - uses: actions/upload-artifact@v6
        with:
          name: cumulative-frame-generation-validation-${{ env.CUMULATIVE_COMMIT }}
          path: fg-package/
          if-no-files-found: error

  HistoricalInstallerTools:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Test authored installer with dummy files on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./custom/gameplay-fix-installer/Test-Installer.ps1 -InstallerScript ./custom/gameplay-fix-installer/Install-Fix.ps1 -TestRoot "$env:RUNNER_TEMP\OpenMW installer checks" -ReportPath "$env:GITHUB_WORKSPACE\installer-test-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-fix-installer-verification-${{ env.CUMULATIVE_COMMIT }}
          path: |
            installer-test-report.json
            ${{ runner.temp }}/OpenMW installer checks/**/invoke-*.json
            ${{ runner.temp }}/OpenMW installer checks/**/invoke-*.stdout.txt
            ${{ runner.temp }}/OpenMW installer checks/**/invoke-*.stderr.txt
            ${{ runner.temp }}/OpenMW installer checks/**/receipt.json
          if-no-files-found: error

  GameplaySourceCollector:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
      - name: Test read-only collector with authored dummy files on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./custom/gameplay-source-collector/Test-Collector.ps1 -CollectorScript ./custom/gameplay-source-collector/Collect-Sources.ps1 -TestRoot "$env:RUNNER_TEMP\OpenMW collector checks" -ReportPath "$env:GITHUB_WORKSPACE\collector-test-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-source-collector-verification-${{ env.CUMULATIVE_COMMIT }}
          path: |
            collector-test-report.json
            ${{ runner.temp }}/OpenMW collector checks/**/invoke-*.json
            ${{ runner.temp }}/OpenMW collector checks/**/invoke-*.stdout.txt
            ${{ runner.temp }}/OpenMW collector checks/**/invoke-*.stderr.txt
          if-no-files-found: error

  PerformanceCaptureFollowup:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    timeout-minutes: 10
