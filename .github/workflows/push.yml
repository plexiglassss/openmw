name: OpenMW - gameplay installer checks (Windows)
on:
  push:
    branches: [tools/gameplay-activation-installer-20261106]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gameplay-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Windows:
    runs-on: windows-2022
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 16
      - name: Verify that only installer diagnostics and tests changed
        shell: pwsh
        run: |
          $base = '5b84be8c1b8fc283b58755127e1aa078d7f2b4a0'
          $allowed = @('.github/workflows/push.yml', 'custom/gameplay-responsiveness/Install-Fix.ps1', 'custom/gameplay-responsiveness/Test-Installer.ps1')
          $changed = @(git diff --name-only $base)
          if ($LASTEXITCODE) { throw 'Cannot compare installer source to the engine build' }
          foreach ($path in $changed) { if ($path -notin $allowed) { throw "Unexpected source change: $path" } }
          git diff --check $base
          if ($LASTEXITCODE) { throw 'Source whitespace validation failed' }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE) { throw 'The reviewed engine source is not preserved as an ancestor' }
      - name: Test installer and blocked-source evidence on Windows PowerShell
        shell: powershell
        run: |
          ./custom/gameplay-responsiveness/Test-Installer.ps1 -InstallerScript ./custom/gameplay-responsiveness/Install-Fix.ps1 -WrapperScript ./custom/gameplay-responsiveness/Install-All.ps1 -TestRoot ./installer-fixtures -ReportPath ./gameplay-installer-tests.json
          if ($LASTEXITCODE) { throw 'Installer regression tests failed' }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gameplay-installer-tests-${{ github.sha }}
          path: |
            gameplay-installer-tests.json
            custom/gameplay-responsiveness/Install-Fix.ps1
            custom/gameplay-responsiveness/Install-All.ps1
            custom/gameplay-responsiveness/Test-Installer.ps1
          if-no-files-found: error
