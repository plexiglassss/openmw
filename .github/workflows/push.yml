name: OpenMW - combined native performance
on:
  pull_request:
    branches: [perf/gameplay-activation-20261106]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
env:
  CUMULATIVE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
  actions: read
concurrency:
  group: cumulative-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  Windows:
    if: github.head_ref != 'fix/windows-package-20261106'
    runs-on: windows-2022
    env:
      # Keep tracked bytes identical to the verified source on Windows too.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: openmw-msvc-2022-Release-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CUMULATIVE_COMMIT }}
          fetch-depth: 100
      - name: Reuse tested engine for eligible packaging-only changes
        id: existing_engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python custom/combined-performance/reuse-windows-engine.py
      - name: Verify historical source gates and complete cumulative source
        shell: pwsh
        run: |
          $commits = @(
            '91cf944a0fe8a3d2333b3ae97ccb17376c577565',
            'ce3d5a2e981999df432cf8df416352cc85842e97',
            'de695387ff24adac5ff28a56eaac30d996e45011',
            'cbdf7a0adfac4c33f0d5f5bc62174f3bd3146fd0',
            'b34db5770f947b0f5b90dc699627c2ccdae12f16',
            '528bffb348872a964d25c092fa5dd574c1b7f673',
            '1b78b9c1a566b91bbe1576387842625f3ae509d1',
            '5b84be8c1b8fc283b58755127e1aa078d7f2b4a0',
            'caeede91ff424d63b398737eb0220dea29058981',
            '541a1e13cfcdac0c1101c08a465ea2c61ab951e4',
            '5a446619744f2b07eb5efecef75c048ad09d046b',
            'ba5c0bb03bb13604adf61781b8afb0d63ea231f0',
            '80ce5372258b3cffd972dbdd2565d80e940b9351'
          )
          foreach ($commit in $commits) {
            git fetch --no-tags --depth=100 origin $commit
            if ($LASTEXITCODE) { throw "Cannot recover preserved source $commit" }
          }
          $gates = @(
            @{ Path = 'preservation-dialogue'; Commit = '528bffb348872a964d25c092fa5dd574c1b7f673'; Script = 'custom/dialogue-colours/verify-source.py'; Manifest = 'dialogue-colours-source-manifest.json' },
            @{ Path = 'preservation-shrine'; Commit = '1b78b9c1a566b91bbe1576387842625f3ae509d1'; Script = 'custom/shrine-tooltips/verify-source.py'; Manifest = 'shrine-tooltips-source-manifest.json' },
            @{ Path = 'preservation-gameplay'; Commit = '5b84be8c1b8fc283b58755127e1aa078d7f2b4a0'; Script = 'custom/gameplay-responsiveness/verify-source.py'; Manifest = 'gameplay-responsiveness-source-manifest.json' },
            @{ Path = 'preservation-message'; Commit = 'caeede91ff424d63b398737eb0220dea29058981'; Script = 'custom/message-position/verify-source.py'; Manifest = 'message-position-source-manifest.json' }
          )
          foreach ($gate in $gates) {
            git worktree add --detach $gate.Path $gate.Commit
            if ($LASTEXITCODE) { throw "Cannot prepare $($gate.Path)" }
            try {
              python "$($gate.Path)/$($gate.Script)"
              if ($LASTEXITCODE) { throw "Preserved source gate failed: $($gate.Path)" }
              Copy-Item "$($gate.Path)/$($gate.Manifest)" ./
            } finally {
              git worktree remove --force $gate.Path
              if ($LASTEXITCODE) { throw "Cannot remove $($gate.Path)" }
            }
          }
          git worktree add --detach preservation-cumulative de695387ff24adac5ff28a56eaac30d996e45011
          if ($LASTEXITCODE) { throw 'Cannot prepare the exact preserved cumulative baseline' }
          Push-Location preservation-cumulative
          try {
            python custom/cumulative/verify-source.py
            if ($LASTEXITCODE) { throw 'Historical cumulative source union failed' }
            python custom/loading-repair/apply.py
            if ($LASTEXITCODE) { throw 'Historical lookup patch failed' }
            python custom/loading-repair/check-integration.py
            if ($LASTEXITCODE) { throw 'Historical waiting-stage rollback check failed' }
            python custom/cumulative/verify-source.py --after-lookup
            if ($LASTEXITCODE) { throw 'Historical compiled source union failed' }
            Copy-Item cumulative-source-manifest.json,cumulative-build-source-manifest.json ../
          } finally {
            Pop-Location
            git worktree remove --force preservation-cumulative
            if ($LASTEXITCODE) { throw 'Cannot remove historical verification worktree' }
          }
          git worktree add --detach preservation-menu 91cf944a0fe8a3d2333b3ae97ccb17376c577565
          if ($LASTEXITCODE) { throw 'Cannot prepare the accepted menu feature baseline' }
          Push-Location preservation-menu
          try {
            python custom/menu-qol/verify-source.py
            if ($LASTEXITCODE) { throw 'Historical menu feature preservation failed' }
            python custom/loading-repair/apply.py
            if ($LASTEXITCODE) { throw 'Historical menu lookup patch failed' }
            python custom/loading-repair/check-integration.py
            if ($LASTEXITCODE) { throw 'Historical menu waiting-stage rollback check failed' }
            python custom/menu-qol/verify-source.py --after-lookup
            if ($LASTEXITCODE) { throw 'Historical compiled menu feature preservation failed' }
            Copy-Item menu-qol-source-manifest.json,menu-qol-build-source-manifest.json ../
          } finally {
            Pop-Location
            git worktree remove --force preservation-menu
            if ($LASTEXITCODE) { throw 'Cannot remove historical menu verification worktree' }
          }
          git worktree add --detach preservation-combined ce3d5a2e981999df432cf8df416352cc85842e97
          if ($LASTEXITCODE) { throw 'Cannot prepare the combined Continue and deleveler baseline' }
          Push-Location preservation-combined
          try {
            python custom/deleveler/verify-source.py
            if ($LASTEXITCODE) { throw 'Historical combined engine source verification failed' }
            python custom/loading-repair/apply.py
            if ($LASTEXITCODE) { throw 'Historical combined lookup patch failed' }
            python custom/loading-repair/check-integration.py
            if ($LASTEXITCODE) { throw 'Historical combined waiting-stage rollback check failed' }
            python custom/deleveler/verify-source.py --after-lookup
            if ($LASTEXITCODE) { throw 'Historical compiled combined source verification failed' }
            Copy-Item deleveler-source-manifest.json,deleveler-build-source-manifest.json ../
          } finally {
            Pop-Location
            git worktree remove --force preservation-combined
            if ($LASTEXITCODE) { throw 'Cannot remove historical combined verification worktree' }
          }
          python custom/town-performance/verify-source.py
          if ($LASTEXITCODE) { throw 'Town performance source or combined feature preservation failed' }
      - name: Test script installer preflight and rollback on authored fixtures
        shell: powershell
        run: |
          ./custom/gameplay-responsiveness/Test-Installer.ps1 -InstallerScript ./custom/gameplay-responsiveness/Install-Fix.ps1 -WrapperScript ./custom/gameplay-responsiveness/Install-All.ps1 -TestRoot ./installer-fixtures -ReportPath ./gameplay-installer-tests.json
          if ($LASTEXITCODE) { throw 'Script installer regression tests failed' }
      - name: Compare SaneMagic adapters with captured originals in both Lua runtimes
        shell: pwsh
        run: |
          python -m pip install -r custom/combined-performance/tests/requirements.txt
          if ($LASTEXITCODE) { throw 'Lua adapter test runtime installation failed' }
          python custom/combined-performance/tests/test_sanemagic_adapters.py --output sanemagic-adapter-parity.json
          if ($LASTEXITCODE) { throw 'SaneMagic native/fallback adapter behavior differs from the captured originals' }
      - name: Exercise captured map, quest and proximity adapters
        shell: pwsh
        run: python custom/combined-performance/tests/test_native_adapters.py --output native-job-adapter-parity.json
      - name: Test combined launcher in Windows PowerShell
        shell: powershell
        run: ./custom/combined-performance/Test-Launcher.ps1 -ReportPath combined-launcher-windows-powershell.json
      - name: Test combined launcher in PowerShell 7
        shell: pwsh
        run: ./custom/combined-performance/Test-Launcher.ps1 -ReportPath combined-launcher-pwsh.json
      - name: Test settings editing and rollback in Windows PowerShell
        shell: powershell
        run: |
          ./custom/gameplay-responsiveness/Test-Settings.ps1
          if ($LASTEXITCODE) { throw 'Windows PowerShell settings tests failed' }
      - name: Test settings editing and rollback in PowerShell 7
        shell: pwsh
        run: |
          ./custom/gameplay-responsiveness/Test-Settings.ps1
          if ($LASTEXITCODE) { throw 'PowerShell 7 settings tests failed' }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test notification placement before compiling the engine
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX custom/message-position/test-position.cpp /Fe:message-position-tests.exe
          if ($LASTEXITCODE) { throw 'Notification geometry test compilation failed' }
          ./message-position-tests.exe | Tee-Object message-position-tests.txt
          if ($LASTEXITCODE) { throw 'Notification geometry regressions failed' }
      - name: Validate native map classification and resource budget
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /O2 /W4 /WX /I . custom/map-icons/test-classification.cpp components/mapmarkers/classification.cpp /Fe:map-icons-classifier.exe
          if ($LASTEXITCODE) { throw 'Map icon classifier compilation failed' }
          python custom/map-icons/verify-classification.py --binary ./map-icons-classifier.exe --receipt map-icons-classification.json --cmake-copy
          if ($LASTEXITCODE) { throw 'Map icon classification, assets or allocation checks failed' }
      - name: Verify Ninja supplied with the Visual Studio build tools
        shell: pwsh
        run: |
          $ninja = Get-Command ninja.exe -ErrorAction Stop
          Write-Host "Using $($ninja.Source)"
          & $ninja.Source --version
          if ($LASTEXITCODE) { throw 'The installed Ninja build tool failed its version check' }
      - name: Prepare the verified compiler cache tool through the release asset API
        shell: pwsh
        env:
          OPENMW_RELEASE_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sccache-v0.18.0-windows-x64.tar.gz'
          curl --fail --retry 3 --connect-timeout 20 --max-time 120 -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:OPENMW_RELEASE_TOKEN" -o $archive https://api.github.com/repos/mozilla/sccache/releases/assets/563130158
          if ($LASTEXITCODE) { throw 'Compiler cache release asset download failed' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1a63c1be2beab3f04d27e4cc145443e092e02d3dd83a51030989829d7023091b') {
            throw 'Compiler cache archive does not match the official release asset digest'
          }
          $unpack = Join-Path $env:RUNNER_TEMP 'verified-sccache'
          New-Item -ItemType Directory -Force $unpack | Out-Null
          tar -xzf $archive -C $unpack
          if ($LASTEXITCODE) { throw 'Compiler cache archive extraction failed' }
          $toolPath = Join-Path $env:RUNNER_TOOL_CACHE 'sccache/0.18.0/x64'
          New-Item -ItemType Directory -Force $toolPath | Out-Null
          Copy-Item "$unpack/sccache-v0.18.0-x86_64-pc-windows-msvc/*" $toolPath
          & "$toolPath/sccache.exe" --version
          if ($LASTEXITCODE) { throw 'Verified compiler cache executable failed to start' }
          New-Item -ItemType File -Force "$toolPath.complete" | Out-Null
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.18.0
      - name: Apply lookup-only repair and verify waiting-stage rollback
        shell: pwsh
        run: |
          python custom/loading-repair/apply.py
          if ($LASTEXITCODE) { throw 'Source baseline/patch validation failed' }
          python custom/loading-repair/check-integration.py
          if ($LASTEXITCODE) { throw 'Waiting-stage rollback/source validation failed' }
          python custom/town-performance/verify-source.py --after-lookup
          if ($LASTEXITCODE) { throw 'Final compiled source differs from the reviewed town performance source' }
          git diff --check
          if ($LASTEXITCODE) { throw 'Invalid source diff' }
          git diff --binary --output=loading-repair-applied.patch -- apps/
      - name: Record dependency versions
        shell: bash
        run: sed '/^\s*#/d; /^\s*$/d' CI/deps_versions.msvc.sh >> "$GITHUB_ENV"
      - name: Download verified dependencies
        shell: pwsh
        env:
          OPENMW_RELEASE_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force deps, deps/Qt | Out-Null
          Set-Location deps
          $manifest = "vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}-manifest.txt"
          curl --fail --retry 3 -L -o "$manifest" "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/$manifest"
          if ($LASTEXITCODE) { throw 'Dependency manifest download failed' }
          $lines = Get-Content "$manifest"
          $parts = -split $lines[1]
          $archiveName = 'vcpkg-x64-windows-2022-2026-09-09.7z'
          $releaseUrl = "https://github.com/OpenMW/openmw-deps-build/releases/download/2026-09-09/$archiveName"
          if ($parts.Count -ne 2 -or $parts[1] -ne $archiveName -or $lines[0] -ne $releaseUrl) {
            throw 'Dependency manifest no longer identifies the pinned original release asset'
          }
          curl --fail --retry 3 --connect-timeout 20 --max-time 300 -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:OPENMW_RELEASE_TOKEN" -o $archiveName https://api.github.com/repos/OpenMW/openmw-deps-build/releases/assets/553691121
          if ($LASTEXITCODE) { throw 'Dependency archive download failed' }
          if ((Get-FileHash $parts[1] -Algorithm SHA512).Hash -ne $parts[0]) { throw 'Dependency hash mismatch' }
          7z x -y "-ovcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}" $parts[1]
          if ($LASTEXITCODE) { throw 'Dependency extraction failed' }
      - uses: actions/cache@v5
        id: qt-cache
        with:
          path: deps/Qt/${{ env.QT_VER }}/msvc2019_64
          key: qt-cache-${{ env.QT_VER }}-msvc2019_64-v1
      - name: Download Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: deps/Qt
        env:
          OPENMW_RELEASE_TOKEN: ${{ github.token }}
        run: |
          curl --fail --retry 3 --connect-timeout 20 --max-time 120 -L -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:OPENMW_RELEASE_TOKEN" -o aqt_x64.exe https://api.github.com/repos/miurahr/aqtinstall/releases/assets/165924575
          if ($LASTEXITCODE) { throw 'Qt installer download failed' }
          if ((Get-FileHash aqt_x64.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f9e9acc05975f2e70e4935ace76b41882cda4b53eb779c9bcf1d87a95029a6b0') {
            throw 'Qt installer does not match the verified original v3.1.15 release asset'
          }
          ./aqt_x64.exe install-qt windows desktop ${{ env.QT_VER }} win64_msvc2019_64
          if ($LASTEXITCODE) { throw 'Qt installation failed' }
      - name: Cache the original source dependency archives with verified retries
        shell: pwsh
        run: |
          $archives = @(
            @{ Name = 'recastnavigation'; File = '03259f3287ff8330f0d66fcd98d022edddffaa97.zip'; Url = 'https://codeload.github.com/OpenMW/recastnavigation/zip/03259f3287ff8330f0d66fcd98d022edddffaa97'; Hash = '63db2ac90904764d7f1466d3c95994ec51d777cddd870b70f8ef674c09ed166b3d16ffc4ac1d18d0eab865fda4bf51b6ea17049025b66a338d3cadd0f48dc712' },
            @{ Name = 'sqlite3'; File = 'sqlite-amalgamation-3410100.zip'; Url = 'https://www.sqlite.org/2023/sqlite-amalgamation-3410100.zip'; Hash = '7de291709e88fffc693cf24ac675950cfc35c1bf7631cfea95167105720a05cf37fb943c57c5c985db2eeaa57b31894b3c0df98a7bd2939b5746fc5a24b5ae87' },
            @{ Name = 'yaml-cpp'; File = 'c2680200486572baf8221ba052ef50b58ecd816e.zip'; Url = 'https://codeload.github.com/jbeder/yaml-cpp/zip/c2680200486572baf8221ba052ef50b58ecd816e'; Hash = '9eb328e37ff547e7f681d64e3a8f268a8a5645cb1c258106d1d9f959eec498dfc7c466690c56f210ad7d5fb95b806a30c87ccbb019cccf5c3c6135cfc3c13fe1' },
            @{ Name = 'googletest'; File = 'v1.17.0.zip'; Url = 'https://codeload.github.com/google/googletest/zip/refs/tags/v1.17.0'; Hash = '2712d6f6e7f38eb0c8d5ebba957588c70aff68ea433c7aa0b31bde8cacfbe47de908a6e5a99a021969da568f5075daa2c45fca602bbf56711d146d333b76562b' }
          )
          $declarations = Get-Content extern/CMakeLists.txt -Raw
          foreach ($item in $archives) {
            if (-not $declarations.Contains("URL_HASH SHA512=$($item.Hash)") -or -not $declarations.Contains("SOURCE_DIR fetched/$($item.Name)")) {
              throw "Source archive cache no longer matches the declared original dependency: $($item.Name)"
            }
            $directory = "build/_deps/$($item.Name)-subbuild/$($item.Name)-populate-prefix/src"
            New-Item -ItemType Directory -Force $directory | Out-Null
            $archive = Join-Path $directory $item.File
            curl --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -L -o $archive $item.Url
            if ($LASTEXITCODE) { throw "Source archive download failed: $($item.Name)" }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $item.Hash) {
              throw "Source archive differs from the original CMake dependency hash: $($item.Name)"
            }
          }
      - name: Configure Release build with existing diagnostic cache
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release
          -D CMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/scripts/buildsystems/vcpkg.cmake'
          -D CMAKE_PREFIX_PATH='${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64'
          -D CMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG"
          -D "CMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF /INCREMENTAL:NO"
          -D LuaJit_INCLUDE_DIR='${{ github.workspace }}/deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/installed/x64-windows/include/luajit'
          -D LuaJit_LIBRARY='${{ github.workspace }}/deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/installed/x64-windows/lib/lua51.lib'
          -D BUILD_BENCHMARKS=OFF -D BUILD_COMPONENTS_TESTS=ON -D BUILD_OPENMW_TESTS=ON
          -D BUILD_OPENCS_TESTS=OFF -D BUILD_OPENCS=ON -D BUILD_ESSIMPORTER=ON -D BUILD_BSATOOL=ON
          -D BUILD_ESMTOOL=ON -D BUILD_NIFTEST=ON -D BUILD_BULLETOBJECTTOOL=ON
          -D OPENMW_USE_SYSTEM_SQLITE3=OFF -D OPENMW_USE_SYSTEM_YAML_CPP=OFF -D OPENMW_LTO_BUILD=ON
          -D PRECOMPILE_HEADERS_WITH_MSVC=OFF -D CMAKE_POLICY_DEFAULT_CMP0141=NEW
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -D CMAKE_C_COMPILER_LAUNCHER=sccache
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache -D CMAKE_EXPORT_COMPILE_COMMANDS=ON
          -D CMAKE_JOB_POOLS=link=1 -D CMAKE_JOB_POOL_LINK=link
      - name: Compile the parallel native engine changes and their tests first
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: >
          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/engine.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/cellbindings.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/luamanagerimp.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/magicbindings.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/nativequeryservice.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/nearbybindings.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwmechanics/activespells.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwmechanics/actors.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwrender/objectpaging.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwlua/testnativequeryservice.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwworld/testcelllookup.cpp.obj
          -- -k 0
      - name: Run actual native options forms before engine linking
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: |
          cmake --build build --target openmw-controls-tests
          if ($LASTEXITCODE) { throw 'Standalone native controls build failed' }
          $deps = 'deps/vcpkg-x64-windows-2022-${{ env.VCPKG_TAG }}/installed/x64-windows/bin'
          Copy-Item "$deps/Release/MyGUIEngine.dll" build/
          Copy-Item "$deps/*.dll" build/
          ./build/openmw-controls-tests.exe --gtest_output=xml:map-icon-controls-early.xml
          if ($LASTEXITCODE) { throw 'Actual native controls regressions failed' }
          [xml]$controlsXml = Get-Content -Raw map-icon-controls-early.xml
          foreach ($suiteName in @('MapIconControlsTest','MessagePositionControlsTest','TooltipControlsTest')) {
            $controlSuites = @($controlsXml.testsuites.testsuite | Where-Object { $_.name -eq $suiteName })
            if ($controlSuites.Count -ne 1 -or @($controlSuites[0].testcase).Count -ne 4) {
              throw "Missing required actual controls cases: $suiteName"
            }
            if (@($controlSuites[0].testcase | Where-Object { $_.status -ne 'run' -or $_.result -ne 'completed' }).Count) {
              throw "Actual controls cases did not execute: $suiteName"
            }
          }
      - name: Compile Lua UI images and native regressions first
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: >
          cmake --build build --target
          components/CMakeFiles/components.dir/lua_ui/widget.cpp.obj
          components/CMakeFiles/components.dir/lua_ui/image.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testluauilayout.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/magicbindings.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwlua/testmagicbindings.cpp.obj
      - name: Compile native deleveling and its engine regressions first
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: >
          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/mwmechanics/levelledlist.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwmechanics/testlevelledlist.cpp.obj
      - name: Compile rest and Continue implementation and regression tests first
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: >
          cmake --build build --target
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/mainmenu.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwgui/waitdialog.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testcontinuegame.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testresttime.cpp.obj
          apps/openmw_tests/CMakeFiles/openmw-tests.dir/mwgui/testmainmenubutton.cpp.obj
      - name: Compile Lua cache change and lifecycle tests first
        if: steps.existing_engine.outputs.reused != 'true'
        shell: pwsh
        run: >
          cmake --build build --target
          components/CMakeFiles/components.dir/lua/scripttracker.cpp.obj
          components/CMakeFiles/components.dir/lua/scriptscontainer.cpp.obj
          apps/openmw/CMakeFiles/openmw-lib.dir/mwlua/luamanagerimp.cpp.obj
          apps/components_tests/CMakeFiles/components-tests.dir/lua/testscriptscontainer.cpp.obj
      - name: Compile lookup change first
