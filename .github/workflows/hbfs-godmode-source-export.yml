name: HBFS god-mode source export

on:
  push:
    branches:
      - fix/hbfs-godmode-effects-20261115

permissions:
  contents: read
  actions: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Collect exact source inputs
        run: |
          mkdir -p source-export/apps/openmw/mwmechanics
          mkdir -p source-export/apps/openmw_tests
          cp apps/openmw/mwmechanics/spelleffects.cpp source-export/apps/openmw/mwmechanics/
          cp apps/openmw/mwmechanics/spelleffects.hpp source-export/apps/openmw/mwmechanics/
          cp apps/openmw_tests/CMakeLists.txt source-export/apps/openmw_tests/
      - uses: actions/upload-artifact@v6
        with:
          name: hbfs-godmode-source-export
          path: source-export/
          if-no-files-found: error
