name: Performance capture collector checks
on:
  push:
    branches: [tools/performance-capture-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Exercise collector on Windows PowerShell 5.1
        shell: powershell
        run: |
          & ./custom/performance-capture/Test-Capture.ps1 -CaptureScript ./custom/performance-capture/Start-Capture.ps1 -TestRoot "$env:RUNNER_TEMP\OpenMW capture smoke" -ReportPath "$env:GITHUB_WORKSPACE\capture-test-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-capture-verification
          path: |
            capture-test-report.json
            ${{ runner.temp }}/OpenMW capture smoke/captures/**/session.json
            ${{ runner.temp }}/OpenMW capture smoke/captures/**/trace-validation.json
            ${{ runner.temp }}/OpenMW capture smoke/captures/**/warnings.json
          if-no-files-found: error
