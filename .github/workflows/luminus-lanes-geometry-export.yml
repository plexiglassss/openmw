name: Luminus Lanes Geometry Export

on:
  push:
    branches:
      - audit/luminus-lanes-assets-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install OpenMW build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo add-apt-repository ppa:openmw/openmw
          sudo apt-get update
          sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic
          sudo apt-get install -y p7zip-full jq

      - name: Build OpenMW NIF geometry exporter
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON \
            -D USE_SYSTEM_TINYXML=ON \
            -D BUILD_NIFTEST=ON
          cmake --build build --target nifgeometry -- -j2
          build/nifgeometry 2>&1 | tee nifgeometry-usage.txt || test ${PIPESTATUS[0]} -eq 2

      - name: Collect support meshes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/project-atlas work/momw out/source out/obj out/logs
          git clone --depth 1 --filter=blob:none --sparse https://github.com/MelchiorDahrk/Project-Atlas.git work/project-atlas
          (cd work/project-atlas && git sparse-checkout set '00 Core/Meshes/f' '04 Emperor Parasols - Smoothed')
          curl -fL --retry 3 -A 'Mozilla/5.0' \
            https://gitlab.com/modding-openmw/momw-patches/-/archive/3.45.2/momw-patches-3.45.2.zip \
            -o work/momw.zip
          unzip -q work/momw.zip -d work/momw
          find work/project-atlas work/momw -type f -iname '*.nif' \( \
            -iname 'flora_emp_parasol_*.nif' -o \
            -iname 'flora_tree_*.nif' -o \
            -iname 'flora_tree_ai_*.nif' -o \
            -iname 'furn_de_rope_*.nif' -o \
            -iname 'furn_pole_support_*.nif' -o \
            -iname 'furn_roped_pole_*.nif' \
          \) -print0 | while IFS= read -r -d '' f; do
            rel="${f#work/}"
            dest="out/source/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Query public Nexus GraphQL and preview metadata
        shell: bash
        continue-on-error: true
        run: |
          set -x
          cat > out/logs/query.json <<'JSON'
          {"query":"query { modFiles(modId: 45779, gameId: 100) { fileId name uri version size sizeInBytes categoryId date } }"}
          JSON
          curl -fsSL -A 'Mozilla/5.0' -H 'Content-Type: application/json' \
            --data @out/logs/query.json https://api.nexusmods.com/v2/graphql \
            -o out/logs/nexus-modfiles.json || true
          cat > out/logs/animated-query.json <<'JSON'
          {"query":"query { modFiles(modId: 60528, gameId: 100) { fileId name uri version size sizeInBytes categoryId date } }"}
          JSON
          curl -fsSL -A 'Mozilla/5.0' -H 'Content-Type: application/json' \
            --data @out/logs/animated-query.json https://api.nexusmods.com/v2/graphql \
            -o out/logs/nexus-animated-modfiles.json || true

      - name: Try public Remiros archive endpoints
        shell: bash
        continue-on-error: true
        run: |
          set -x
          mkdir -p work/remiros
          while IFS=$'\t' read -r modid uri; do
            encoded=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$uri")
            urls=(
              "https://file-metadata.nexusmods.com/file/nexus-files-s3-meta/100/${modid}/${encoded}.json"
              "https://cf-files.nexusmods.com/cdn/100/${modid}/${encoded}"
              "https://supporter-files.nexus-cdn.com/100/${modid}/${encoded}"
              "https://premium-files.nexus-cdn.com/100/${modid}/${encoded}"
            )
            for url in "${urls[@]}"; do
              key=$(printf '%s' "$url" | sha256sum | cut -d' ' -f1)
              echo "$url" >> out/logs/remiros-attempts.txt
              curl -L --retry 2 --connect-timeout 30 -A 'Mozilla/5.0' -D "out/logs/${key}.headers" "$url" -o "work/remiros/${key}.download" || true
              file "work/remiros/${key}.download" >> out/logs/remiros-file-types.txt 2>&1 || true
              if 7z t "work/remiros/${key}.download" >/dev/null 2>&1; then
                mkdir -p "work/remiros/extracted-${key}"
                7z x -y "work/remiros/${key}.download" "-owork/remiros/extracted-${key}" > "out/logs/${key}-extract.log"
              fi
            done
          done < <(
            jq -r '.data.modFiles[]? | select(.fileId == 1000014117) | ["45779", .uri] | @tsv' out/logs/nexus-modfiles.json
            jq -r '.data.modFiles[]? | ["60528", .uri] | @tsv' out/logs/nexus-animated-modfiles.json
          )
          find work/remiros -type f -iname '*.nif' -print0 | while IFS= read -r -d '' f; do
            rel="${f#work/remiros/}"
            dest="out/source/remiros/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Convert NIF meshes with OpenMW
        shell: bash
        run: |
          set -euxo pipefail
          : > out/logs/conversion.tsv
          find out/source -type f -iname '*.nif' -print0 | while IFS= read -r -d '' f; do
            rel="${f#out/source/}"
            obj="out/obj/${rel%.*}.obj"
            mkdir -p "$(dirname "$obj")"
            if build/nifgeometry "$f" "$obj" > "${obj}.openmw.log" 2>&1; then
              echo -e "PASS\t$f\t$obj" >> out/logs/conversion.tsv
            else
              echo -e "FAIL\t$f\t$obj" >> out/logs/conversion.tsv
              rm -f "$obj"
            fi
          done

      - name: Manifest
        shell: bash
        run: |
          set -euxo pipefail
          find out -type f -printf '%p\t%s\n' | sort > out/FILES.tsv
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          cat out/logs/conversion.tsv

      - name: Upload geometry
        uses: actions/upload-artifact@v4
        with:
          name: luminus-lanes-geometry-export
          path: out
          if-no-files-found: error
          retention-days: 7
