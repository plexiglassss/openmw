name: Export source snapshot

on:
  push:
    branches: [perf/generic-native-jobs-20261109]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Create exact source archive
        run: git archive --format=zip --output="openmw-source-${GITHUB_SHA}.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: openmw-source-${{ github.sha }}
          path: openmw-source-${{ github.sha }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
