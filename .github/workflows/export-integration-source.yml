name: Export integration source

on:
  push:
    branches:
      - feat/location-rendering-profiles-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE-COMMIT.txt
          tar --exclude=.git -czf "openmw-source-${GITHUB_SHA}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: openmw-integration-source-${{ github.sha }}
          path: openmw-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
