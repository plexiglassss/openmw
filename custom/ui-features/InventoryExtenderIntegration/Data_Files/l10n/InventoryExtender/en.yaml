ConfigTitle: Inventory Extender
ConfigSummary: |-
  A Lua replacement for the inventory window with a modernized list-based interface.
  --- v%{version} ---

RequiresReload: Some changes require a Lua reload to take effect.

ConfigCategoryKeybinds: Keybinds
KeybindUseItem: Use item
KeybindUseItemDesc: |-
  Instantly use the hovered inventory item.
KeybindToggleFavorite: Toggle favorite
KeybindToggleFavoriteDesc: |-
  Toggle favorite status for the hovered inventory item.
  
  Favorited items cannot be sold, dropped, or transfered to other inventories, and are marked with a star icon in the inventory list.
SwapUsePickup: Swap use/pick up
SwapUsePickupDesc: |-
  By default, the above keybind uses items, and left-click picks them up.
  
  Enable this option to swap those behaviors, so that left-click will use items and the keybind will pick them up.

ConfigCategoryWindowOptions: Window Options
EnableMod: Enable mod
OpenInventorySeparately: Open separately from vanilla inventory
OpenInventorySeparatelyDesc: |-
  Do not replace the game's normal player inventory window.
  When the vanilla inventory/interface opens, Inventory Extender opens as a separate window instead.
  Requires a Lua reload or game restart after changing.
ItemViewMode: Item view mode
ItemViewModeDesc: |-
  Choose between a detailed table view or a vanilla-style grid view.
ItemViewMode_Table: Table
ItemViewMode_Grid: Grid
ShowViewModeButton: Show view mode button
ShowViewModeButtonDesc: |-
  Show a button in the top bar to toggle between table and grid view.
WindowBackgroundOpacity: Window background opacity
WindowBackgroundOpacityDesc: |-
  Controls how opaque the Inventory Extender window background is.
  Higher values make the inventory darker and easier to read.
  Close and reopen the inventory after changing this setting.
TableRowHeightMult: Table row height multiplier
TableRowHeightMultDesc: |-
  Adjust the height of rows in the table view, as a multiplier of text size.
TableScrollStep: Table scroll step
TableScrollStepDesc: |-
  Adjust the scroll step of the table view, in number of rows.
TextSizeOverride: Text size override
TextSizeOverrideDesc: |-
  Override the default text size used in the inventory window. 
  Set to 0 to use the game's default size.
IconPack: Icon pack
IconPackDesc: |-
  Choose which Inventory Extender icon pack to use.
InventoryWindowPinned: Inventory pinned
InventoryWindowDimensions: Inventory window
InventoryContainerWindowDimensions: Inventory (container)
InventoryBarterWindowDimensions: Inventory (barter)
InventoryCompanionWindowDimensions: Inventory (companion)
ContainerWindowDimensions: Container window
BarterWindowDimensions: Barter window
CompanionWindowDimensions: Companion window

ConfigCategoryTweaks: Tweaks
CondensedWeightValue: Condensed weight/value
CondensedWeightValueDesc: |-
  Condense weight and value information in item tooltips.
InvertCategorySwitching: Invert category switching
InvertCategorySwitchingDesc: |-
  By default, when you switch categories, any other windows will switch to the same category unless you hold Shift.
  Enable this option to invert that behavior, so that other windows will only switch categories if you hold Shift.
CompactCategoryFilter: Compact category filter
CompactCategoryFilterDesc: |-
  Move category buttons into the top bar and show the active category in the window title instead of a separate header.
VanillaCategoryIcons: Vanilla-style category icons
VanillaCategoryIconsDesc: |-
  Render category buttons with a vanilla-style plate and opacity-based highlighting.
CategoryBarBorders: Category bar borders
CategoryBarBordersDesc: |-
  Show borders around the category bar.
StolenIndicator: Show stolen indicator
StolenIndicatorDesc: |-
  Show an icon next to stolen items in the inventory.
EnchantedIndicatorMode: Enchanted indicator mode
EnchantedIndicatorModeDesc: |-
  In table view, show enchanted items with the icon swirl, the name-row icon, or both.
  Grid view always shows the swirl.
EnchantedIndicatorMode_Swirl: Swirl
EnchantedIndicatorMode_Icon: Name icon
EnchantedIndicatorMode_Both: Both
ArmsArmorCompareNameIndicator: Arms & Armor compare arrows
ArmsArmorCompareNameIndicatorDesc: |-
    Shows green up-arrows or red down-arrows next to weapon and armor names in table view when Arms & Armor Compare can tell the item is better or worse than the equipped item.
FilledGemsAppearEnchanted: Filled gems appear enchanted
FilledGemsAppearEnchantedDesc: |-
  Show filled soul gems as enchanted items to distinguish them more easily.
EnchantCapacityInTooltips: Enchant capacity in tooltips
EnchantCapacityInTooltipsDesc: |-
  Show the enchant capacity of items in their tooltips.
EnchantCapacityInTooltips_Never: Never
EnchantCapacityInTooltips_Always: Always
EnchantCapacityInTooltips_UnenchantedOnly: Unenchanted only
EnchantCapacityColumnMode: Enchant capacity column
EnchantCapacityColumnModeDesc: |-
  Controls whether the Ench column is shown for all enchantable equipment or only for unenchanted items.
EnchantCapacityColumn_All: All enchantable items
EnchantCapacityColumn_UnenchantedOnly: Unenchanted only
RequirementsColumnMode: Requirements column
RequirementsColumnModeDesc: |-
  Controls whether the Req column shows all requirements or only requirements your character does not currently meet.
RequirementsColumn_All: All requirements
RequirementsColumn_UnmetOnly: Unmet only
SoulGemCapacityInTooltips: Soul gem capacity in tooltips
SoulGemCapacityInTooltipsDesc: |-
  Show the capacity of empty soul gems in their tooltips.
SoulGemCapacityInTooltips_Never: Never
SoulGemCapacityInTooltips_Always: Always
SoulGemCapacityInTooltips_EmptyOnly: Empty only
SoulGemValueInTooltips: Soul gem value in tooltips
SoulGemValueInTooltipsDesc: |-
  Show the soul value of filled soul gems in their tooltips.
HideConditionChargeLabels: Hide condition/charge labels
HideConditionChargeLabelsDesc: |-
  Hide the labels next to the "Condition" and "Charge" bars in item tooltips for a more centered look.

ConfigCategoryModIntegration: Mod Integrations
InterfaceReimagined: Interface Reimagined support
InterfaceReimaginedDesc: |-
  Adjust appearance to better fit the style of Interface Reimagined.
TooltipsComplete: Tooltips Complete support
TooltipsCompleteDesc: |-
  If Tooltips Complete is installed, add its descriptions to item tooltips.

ConfigCategoryMisc: Miscellaneous
ShowControllerWarning: Show controller warning
ShowControllerWarningDesc: |-
  Show a warning message if controller menus are enabled, since the window replacer is not compatible with them.
TooltipCompatibilityMode: HUD tooltip compatibility mode
TooltipCompatibilityModeDesc: |-
  Due to API limitations, mouse-over world tooltips require us to block the entire screen, which has the side effect of blocking tooltips for the HUD (active effects, selected spell, etc.)
  If compatibility mode is ON, the screen will only be blocked if an item is being dragged. This preserves HUD tooltips when not dragging, but world tooltips will be vanilla.

ConfigCategoryGameplay: Gameplay
SoulGemValueRebalance: Soul gem value rebalance
SoulGemValueRebalanceDesc: |-
  Make the value of filled soul gems dependent only on soul magnitude.

