ConfigTooltipShowItemUseCostDesc: Show the charges cost per cast for magic items.
RecentItems: Show recent-item marks
RecentItemsDesc: Mark records whose inventory count increased since the previous inventory refresh. Clear NEW acknowledges all marks. Marks are stored in the save, not persistent Lua storage.
ProtectFavorites: Protect favourite items
ProtectFavoritesDesc: Prevent selling, dropping or transferring favourite items through Inventory Extender. Unfavourite an item or disable this option to move it.
ProtectEquipped: Protect equipped items
ProtectEquippedDesc: Prevent selling, dropping or transferring equipped items through Inventory Extender. Unequip first, or disable this option. Equipping and unequipping remain allowed.
UI_Msg_EquippedProtected: This item is protected because it is equipped. Unequip it first, or disable equipped-item protection.
