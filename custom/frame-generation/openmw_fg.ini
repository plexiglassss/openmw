; OpenMW frame generation — config (place next to openmw.exe)
; mode: async (frame generation) | off (hooks idle, passthrough)
mode=async
; runtime toggle key, VK code (0x23 = End)
hotkey=0x23
; config menu key (0x77 = F8) and fps overlay key (0x78 = F9)
menu_key=0x77
fps_key=0x78
; fps readout overlay (original -> generated)
fps_overlay=1
; optional detailed verification panel: live ratio + cumulative frame counters
diagnostics_overlay=0
; passive overlay position; choose one of:
; top_right | top_left | bottom_right | bottom_left
fps_overlay_anchor=top_right
; inward pixel offsets from the selected anchor
fps_overlay_offset_x=12
fps_overlay_offset_y=12
; hide auxiliary framebuffer-readback render traversals from the display
; (OpenMW uses one while making save/F12 screenshots)
suppress_readback_frames=1
menu_scale=1.5
; vsync on the FG presenter (game vsync setting is bypassed while FG active)
present_vsync=0
scene_change_threshold=0.12
search_radius=2
max_levels=6
stats_interval_sec=5
; pause interpolation when the game already runs at the display refresh
; (two synced presents per frame would halve the base fps, not help it)
auto_pause=1
; display refresh rate override for auto_pause, 0 = auto-detect
display_hz=0
