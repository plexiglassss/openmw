DelevelCreaturesTooltip: |-
    Allow every existing creature-list entry from player level 1. Creatures keep their normal strength.

    Affects future selections, including respawns. Existing actors are not replaced.
DelevelItems: "Delevel Item Lists"
DelevelItemsTooltip: |-
    Allow every existing item-list entry from player level 1, including higher-level loot.

    Affects newly generated inventory. Existing items are not rerolled.
DelevelingHint: |-
    These options affect future spawns and newly generated inventory. Existing creatures and items stay as they are.

    Changes take effect immediately. No restart is needed.

    Your merged leveled lists are still required.
CameraSensitivity: "Camera Sensitivity"
CameraZoomIn: "Zoom Camera In"
CameraZoomOut: "Zoom Camera Out"
ChangeRequiresRestart: "This change requires a restart to take effect."
ClampLighting: "Clamp Lighting"
ClampLightingTooltip: |-
    Cap lighting brightness at (1, 1, 1) to replicate Morrowind's rendering.
    Prevents overly bright or shifted colors but can dull lighting.
ClassicFalloff: "Classic Falloff"
ClassicFalloffTooltip: |-
    Default: off
    Use the traditional point light attenuation formula which lacks an early fade out.

    A flaw of the traditional formula is that light influence never quite reaches zero.
    This is physically accurate, but can cause lighting seams because lights do not affect the entire scene.
    Early fade out helps diminish these seams at the cost of darkening the scene.

    Morrowind uses the traditional formula, so you may want to enable this if you dislike the brightness differences.
    Alternatively, try changing the minimum interior brightness.
